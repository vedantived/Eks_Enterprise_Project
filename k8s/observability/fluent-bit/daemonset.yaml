apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: logging
spec:
  selector:
    matchLabels:
      app: fluent-bit
  template:
    metadata:
      labels:
        app: fluent-bit
    spec:
      serviceAccountName: fluent-bit
      containers:
        - name: fluent-bit
          image: public.ecr.aws/aws-observability/aws-for-fluent-bit:latest  ## official aws Official AWS Fluent Bit image from: aws EKS logging CloudWatch integration
          volumeMounts:
            - name: varlog
              mountPath: /var/log
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: config
              mountPath: /fluent-bit/etc/

      volumes:
        - name: varlog
          hostPath:
            path: /var/log      
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
        - name: config
          configMap:
            name: fluent-bit-config

#Runs Fluent Bit on every node
##Collects logs from all pods

##volumes         Defines what storage is available
##volumeMounts    Defines where that storage is used inside container

# 1. volumes:
#    Define node path (/var/log)

# 2. volumeMounts:
#    Attach that path inside container

# 3. Fluent Bit:
#    Reads logs from mounted path


# App logs generated
#       ↓
# Stored in /var/lib/docker/containers (real)
#       ↓
# Linked to /var/log/containers (symlink)
#       ↓
# Fluent Bit reads from /var/log/containers