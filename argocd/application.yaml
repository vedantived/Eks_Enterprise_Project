apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: zero-trust-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/vedantived/Eks_Enterprise_Project.git
    targetRevision: main
    path: applications/zero-trust-app/base

  destination:
    server: https://kubernetes.default.svc
    namespace: security

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
